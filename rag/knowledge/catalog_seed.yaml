- id: ghost
  repo: library/ghost
  tag: "5"
  category: 部落格
  scenarios: ["個人部落格或日記網站", "發表文章的網誌", "團隊或店家的官方網誌", "寫作分享平台"]
  standalone: true
  standalone_env: {database__client: sqlite3, database__connection__filename: /var/lib/ghost/content/data/ghost.db, NODE_ENV: development}
  env_common: {url: "http://<對外網址>"}
  resources: {memory: 256Mi, cpu: 250m}
  per_replica_users: 150
  notes: "正式模式預設需要 MySQL；單一容器使用 sqlite 時要設 standalone_env；文章與圖片要保存在資料目錄"

