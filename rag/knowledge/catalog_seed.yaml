# C1 軟體目錄（人工部分）
# 只寫人才知道的：用途情境、能否單一容器運作、建議資源、注意事項。
# 連接埠、資料目錄由 rag/build_catalog.py 從 Docker Hub 映像檔設定讀出（依版本），
# 環境變數名稱從 docker-library/docs 擷取，兩者合併成 catalog.json。
# scenarios 是給向量檢索用的情境描述：一般化的說法，不放任何測試題原句。
#
# 欄位：
#   id            目錄內唯一名稱
#   repo          Docker Hub 倉庫（官方映像檔用 library/ 開頭）
#   tag           建議版本（必須存在於 Docker Hub，建立時驗證）
#   category      服務類型
#   scenarios     使用情境（中文）
#   standalone    true＝單一容器即可運作；false＝需要搭配其他服務（系統一次只部署一個服務）
#   requires      standalone=false 時需要的服務
#   standalone_env 能改成單一容器運作的環境變數設定（沒有就省略）
#   env_required  不設定就無法啟動的環境變數（值由使用者提供或系統產生）
#   env_common    常用設定
#   resources     建議的記憶體與 CPU（小型使用）
#   per_replica_users 每個副本大約能服務的同時在線人數（推估副本數用；靜態網站較高）
#   notes         注意事項

- id: nginx
  repo: library/nginx
  tag: "1.27"
  category: 網站
