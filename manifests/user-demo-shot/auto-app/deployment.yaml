---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    gitops.k8s-platform/generated-at: '2026-10-23T13:15:35.269260'
    gitops.k8s-platform/source: llm-generated
  labels:
    app: auto-app
  name: auto-app
  namespace: user-demo-shot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-app
  template:
    metadata:
      labels:
        app: auto-app
    spec:
      containers:
      - env:
        - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
          value: '1'
        image: nginx:latest
        livenessProbe:
          failureThreshold: 3
          httpGet: &id001
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        name: auto-app
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 2
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
